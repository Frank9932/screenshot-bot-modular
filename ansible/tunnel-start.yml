---
- name: Start a quick Cloudflare tunnel for the Screenshot Bot Modular webhook
  hosts: screenshot_bot_modular
  gather_facts: false

  tasks:
    - name: Start tunnel
      ansible.windows.win_shell: |
        powershell.exe -NoProfile -ExecutionPolicy Bypass -File "{{ bot_install_dir }}\scripts\Start-PublicTunnel.ps1" -ConfigPath "{{ bot_install_dir }}\config.json"
      register: tunnel_start
      changed_when: true

    - name: Print tunnel start result
      ansible.builtin.debug:
        var: tunnel_start.stdout
