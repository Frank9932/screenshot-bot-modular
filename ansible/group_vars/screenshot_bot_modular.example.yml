bot_install_dir: C:\Tools\screenshot-bot-modular

bot_install_python: true
python_winget_id: Python.Python.3.12
python_installer_url: https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe

create_startup_task: false

bot_config:
  browser_targets:
    enabled: true
    chrome_path: C:\Program Files\Google\Chrome\Application\chrome.exe
    debug_port: 9221
    profile_dir: runtime\browser-profiles\shared
    raw_dir: screenshots\browser-raw
    startup_timeout_seconds: 15
    ignore_certificate_errors: true
    max_tabs: 10
    targets:
      "1":
        name: webstation-test
        start_url: https://10.121.0.14/login.html
        app_url: https://10.121.0.14/
        tab_count: 5
        tab: 0
        login:
          enabled: true
          username_env: WEBSTATION_USERNAME
          password_env: WEBSTATION_PASSWORD
          keep_alive_interval_seconds: 60
          refresh_interval_seconds: 300
      "2":
        name: webstation-test
        start_url: https://10.121.0.14/login.html
        app_url: https://10.121.0.14/
        tab_count: 5
        tab: 1
        login:
          enabled: true
          username_env: WEBSTATION_USERNAME
          password_env: WEBSTATION_PASSWORD
          keep_alive_interval_seconds: 60
          refresh_interval_seconds: 300
      "3":
        name: webstation-test
        start_url: https://10.121.0.14/login.html
        app_url: https://10.121.0.14/
        tab_count: 5
        tab: 2
        login:
          enabled: true
          username_env: WEBSTATION_USERNAME
          password_env: WEBSTATION_PASSWORD
          keep_alive_interval_seconds: 60
          refresh_interval_seconds: 300
      "4":
        name: webstation-test
        start_url: https://10.121.0.14/login.html
        app_url: https://10.121.0.14/
        tab_count: 5
        tab: 3
        login:
          enabled: true
          username_env: WEBSTATION_USERNAME
          password_env: WEBSTATION_PASSWORD
          keep_alive_interval_seconds: 60
          refresh_interval_seconds: 300
      "5":
        name: webstation-test
        start_url: https://10.121.0.14/login.html
        app_url: https://10.121.0.14/
        tab_count: 5
        tab: 4
        login:
          enabled: true
          username_env: WEBSTATION_USERNAME
          password_env: WEBSTATION_PASSWORD
          keep_alive_interval_seconds: 60
          refresh_interval_seconds: 300
  virtual_desktop:
    enabled: false
    min_desktop: 1
    max_desktop: 4
    initial_desktop: 1
    state_path: runtime\virtual-desktop-state.json
    lock_path: runtime\virtual-desktop.lock
    lock_timeout_seconds: 30
    switch_key_delay_ms: 180
    settle_delay_ms: 700
    trigger_pattern: "^\\s*(\\d{1,2})\\s*$"
  watermark:
    enabled: true
    fields:
      - label: "Test Area"
        value: "EE-SCRB-RYG1A"
      - label: "Test Item"
        value: "Burn-in-test"
    lines: []
    include_timestamp: true
    timestamp_label: "Capture Time"
    label_separator: ": "
    timestamp_prefix: "Time: "
    timestamp_format: yyyy.MM.dd HH:mm
    font_family: Microsoft YaHei
    font_size: 36
    text_color: "#FFFFFF"
    background_color: "#000000"
    background_opacity: 190
    padding: 18
    margin_left: 70
    margin_bottom: 70
    line_spacing: 8
  wechat_official_webhook:
    enabled: true
    host: 127.0.0.1
    port: 8791
    path: /wechat/official/webhook
    token_env: WECHAT_OFFICIAL_WEBHOOK_TOKEN
    appid_env: WECHAT_APPID
    appsecret_env: WECHAT_APPSECRET
    screenshot_dir: screenshots
    incoming_image_dir: storage\incoming
    screenshot_tool: ScreenshotTool.exe
    capture_message_types: none
    ignore_message_types: image
    capture_timeout_seconds: 15
    dedupe_ttl_seconds: 600
    log_path: logs\wechat-official-webhook-events.jsonl
    state_path: runtime\wechat-official-webhook-state.json
    url_file: runtime\wechat-official-webhook-url.txt
