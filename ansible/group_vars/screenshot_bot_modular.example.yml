  watermark:
    enabled: true
    fields:
      - label: "Test Area"
        value: ""
      - label: "Test Item"
        value: ""
    lines: []
    include_timestamp: true
    timestamp_label: "Capture Time"
    label_separator: ": "
    timestamp_prefix: "Time: "
    timestamp_format: yyyy.MM.dd HH:mm
    font_family: Microsoft YaHei
    font_size: 36
    text_color: "#FFFFFF"
    background_color: "#000000"
    background_opacity: 100
    padding: 18
    margin_left: 70
    margin_bottom: 70
    line_spacing: 8
  wechat_official_webhook:
    enabled: true
    host: 127.0.0.1
    port: 8791
    path: /wechat/official/webhook
    token_env: WECHAT_OFFICIAL_WEBHOOK_TOKEN
    appid_env: WECHAT_APPID
    appsecret_env: WECHAT_APPSECRET
    screenshot_dir: screenshots
    incoming_image_dir: storage\incoming
    private_channel:
      save_dir: storage\private
    ignore_message_types: image
    capture_timeout_seconds: 15
    dedupe_ttl_seconds: 600
    log_path: logs\wechat-official-webhook-events.jsonl
    state_path: runtime\wechat-official-webhook-state.json
    url_file: runtime\wechat-official-webhook-url.txt
