---
- name: Check local secrets status
  hosts: screenshot_bot_modular
  gather_facts: false

  tasks:
    - name: Query local secrets status
      ansible.windows.win_shell: |
        $secretsPath = "{{ bot_install_dir }}\secrets.local.ps1"
        if (Test-Path -LiteralPath $secretsPath) {
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          . $secretsPath
          function Test-ConfiguredSecretValue {
            param([string]$Value)
            if ([string]::IsNullOrWhiteSpace($Value)) { return $false }
            if ($Value.Trim() -like "paste-*") { return $false }
            return $true
          }
          [pscustomobject]@{
            secrets_file = "exists"
            has_wechat_appid = Test-ConfiguredSecretValue $env:WECHAT_APPID
            has_wechat_appsecret = Test-ConfiguredSecretValue $env:WECHAT_APPSECRET
            has_webhook_token = Test-ConfiguredSecretValue $env:WECHAT_OFFICIAL_WEBHOOK_TOKEN
          } | ConvertTo-Json -Compress
        } else {
          [pscustomobject]@{
            secrets_file = "missing"
            has_wechat_appid = $false
            has_wechat_appsecret = $false
            has_webhook_token = $false
          } | ConvertTo-Json -Compress
        }
      register: secrets_status
      changed_when: false

    - name: Print secrets status
      ansible.builtin.debug:
        var: secrets_status.stdout
