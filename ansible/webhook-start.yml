---
- name: Start Screenshot Bot Modular webhook receiver
  hosts: screenshot_bot_modular
  gather_facts: false

  vars:
    webhook_task_name: ScreenshotBotModular-Webhook

  tasks:
    - name: Start webhook through an interactive scheduled task
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        $taskName = "{{ webhook_task_name }}"
        $runner = "{{ bot_install_dir }}\logs\run-webhook.ps1"
        $stdoutLog = "{{ bot_install_dir }}\logs\webhook-task.log"
        $script = "{{ bot_install_dir }}\scripts\Start-WebhookBackground.ps1"

        # Built as its own variable, then interpolated below, rather than embedding the
        # WarmupTeams value directly inline in the heredoc: PowerShell can silently drop an
        # empty-string argument when handing a command line to a native executable (the nested
        # powershell.exe invocation this heredoc builds), leaving the flag with nothing after it.
        # Omitting the flag entirely when there is nothing to pass avoids that instead of relying
        # on an empty string surviving.
        $warmupTeams = "{{ bot_warmup_teams | default('') }}"
        $warmupArg = if ($warmupTeams) { " -WarmupTeams `"$warmupTeams`"" } else { "" }

        @"
        Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
        Set-Location -LiteralPath "{{ bot_install_dir }}"
        powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$script" -ConfigPath "{{ bot_install_dir }}\config.json"$warmupArg *> "$stdoutLog"
        exit `$LASTEXITCODE
        "@ | Set-Content -LiteralPath $runner -Encoding ASCII

        $previousErrorActionPreference = $ErrorActionPreference
        $ErrorActionPreference = "Continue"
        schtasks.exe /End /TN $taskName 2>$null | Out-Null
        schtasks.exe /Delete /TN $taskName /F 2>$null | Out-Null
        $ErrorActionPreference = $previousErrorActionPreference

        # Explicitly stop any previous webhook process HERE, in this WinRM session, rather than
        # relying only on Start-WebhookBackground internal stop call once it is running
        # under the scheduled task below. The scheduled task runs with an /IT (interactive token)
        # session context that, observed in production, does not reliably terminate a process
        # started in a different session, even for the same user account: schtasks
        # End/Delete only removes the task definition, not a process it already detached via
        # Start-Process, so the previous run tracked webhook_pid (and its child) can survive
        # silently as an orphan, doubling up on Chrome/tab management and producing confusing
        # tab-not-debuggable log noise from a process nothing is aware is still running.
        powershell.exe -NoProfile -ExecutionPolicy Bypass -File "{{ bot_install_dir }}\scripts\Stop-WebhookBackground.ps1" | Out-Null

        # No /RL HIGHEST here: an elevated scheduled task and a normal (non-elevated) interactive
        # console are different Windows integrity levels, and a lower-integrity process cannot
        # Stop-Process a higher-integrity one even for the same user account -- that mismatch let
        # a manual restart from a plain console silently fail to kill the process this task had
        # started, and start a second, colliding instance instead. Nothing this task launches
        # needs elevation.
        schtasks.exe /Create /TN $taskName /SC ONCE /ST 23:59 /TR "powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File `"$runner`"" /IT /F | Out-Null
        schtasks.exe /Run /TN $taskName | Out-Null

        $ready = "{{ bot_install_dir }}\runtime\wechat-official-webhook-ready.json"
        $state = "{{ bot_install_dir }}\runtime\wechat-official-webhook-state.json"
        $deadline = (Get-Date).AddSeconds(60)
        while ((!(Test-Path -LiteralPath $ready) -or !(Test-Path -LiteralPath $state)) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
        if (!(Test-Path -LiteralPath $ready)) { throw "Webhook did not become ready. See $stdoutLog" }
        if (!(Test-Path -LiteralPath $state)) { throw "Webhook state was not written. See $stdoutLog" }
        Get-Content -LiteralPath $state -Raw
      register: webhook_start
      changed_when: true

    - name: Print webhook start result
      ansible.builtin.debug:
        var: webhook_start.stdout
