---
- name: Ensure cloudflared is installed for the optional quick tunnel
  hosts: screenshot_bot_modular
  gather_facts: false

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.import_tasks: tasks/validate.yml
      tags: always

  tasks:
    - name: Ensure cloudflared is available
      ansible.builtin.import_tasks: tasks/cloudflared.yml
