---
- name: Check controller-local secrets file
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/files/secrets.local.ps1"
  delegate_to: localhost
  become: false
  run_once: true
  register: local_secrets_file

- name: Fail when controller-local secrets file is missing
  ansible.builtin.fail:
    msg: >-
      ansible/files/secrets.local.ps1 was not found on the controller.
      Copy ansible/files/secrets.local.example.ps1 to ansible/files/secrets.local.ps1
      and fill in WECHAT_APPID / WECHAT_APPSECRET / WECHAT_OFFICIAL_WEBHOOK_TOKEN first.
  when: not local_secrets_file.stat.exists

- name: Deploy secrets.local.ps1 to target
  ansible.windows.win_copy:
    src: "{{ playbook_dir }}/files/secrets.local.ps1"
    dest: "{{ bot_install_dir }}\\secrets.local.ps1"
  no_log: true
